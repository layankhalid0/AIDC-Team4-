server {
    listen 80;

    location /v1/ {
        proxy_pass http://capstone-qwen-serving:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://capstone-qwen-serving:8000;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://capstone-qwen-serving:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://arabic-language-coach-ui:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
