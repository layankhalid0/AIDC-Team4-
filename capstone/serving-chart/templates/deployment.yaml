apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-serving
  labels:
    app.kubernetes.io/name: serving
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  replicas: {{ .Values.replicas }}

  selector:
    matchLabels:
      app.kubernetes.io/name: serving
      app.kubernetes.io/instance: {{ .Release.Name }}

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app.kubernetes.io/name: serving
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      enableServiceLinks: false
      containers:
        - name: qwen
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}