apiVersion: v1
kind: ConfigMap
metadata:
  name: capstone-grafana-provisioning
  namespace: team
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: capstone
        orgId: 1
        folder: Arabic Language Coach
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/capstone
